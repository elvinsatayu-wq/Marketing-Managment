<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ — ระบบจัดการงานการตลาด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // ใช้ธีมเดียวกับหน้าแอป (localStorage 'theme' หรือตามระบบ)
  (function () {
    var t;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root {
    --bg: #f6f9f5;
    --surface: #ffffff;
    --border: #e2e9e0;
    --text: #1f2a1d;
    --muted: #66705f;
    --primary: #4A943E;
    --primary-solid: #4A943E;
    --primary-solid-hover: #3d7d33;
    --primary-ring: rgba(74, 148, 62, .18);
    --red: #dc2626;
    --red-soft: #fef2f2;
    --red-border: #fecaca;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 32px rgba(16, 24, 40, .08);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0d1022;
    --surface: #161a33;
    --border: #2d3350;
    --text: #e8ebf5;
    --muted: #9aa1b9;
    --primary: #6cc35d;
    --primary-solid: #4A943E;
    --primary-solid-hover: #58a84b;
    --primary-ring: rgba(108, 195, 93, .25);
    --red: #f87171;
    --red-soft: rgba(248, 113, 113, .12);
    --red-border: rgba(248, 113, 113, .35);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 32px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    font-family: 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.55;
  }
  button, input { font: inherit; color: inherit; }
  .card {
    width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: var(--shadow); padding: 32px 28px 28px;
  }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .brand-logo { flex-shrink: 0; border-radius: 10px; }
  .brand-logo img { display: block; height: 56px; width: auto; }
  [data-theme="dark"] .brand-logo { background: #fff; padding: 4px 6px; }
  [data-theme="dark"] .brand-logo img { height: 46px; }
  .brand h1 { margin: 0; font-size: 20px; line-height: 1.3; color: var(--primary); }
  .brand p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
  .field { margin-bottom: 16px; }
  .input-wrap { position: relative; }
  input[type="text"], input[type="password"] {
    width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-ring); }
  .input-wrap input { padding-right: 46px; }
  .toggle-pw {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent;
    color: var(--muted); cursor: pointer; display: grid; place-items: center;
  }
  .toggle-pw:hover { color: var(--primary); }
  .toggle-pw svg { width: 18px; height: 18px; }
  .toggle-pw .i-hide, .toggle-pw.on .i-show { display: none; }
  .toggle-pw.on .i-hide { display: block; }
  .hint { margin-top: 4px; font-size: 12px; color: var(--muted); }
  .error {
    display: none; margin-bottom: 16px; padding: 10px 14px; border-radius: 10px; font-size: 14px;
    background: var(--red-soft); color: var(--red); border: 1px solid var(--red-border);
  }
  .error.show { display: block; }
  .btn {
    width: 100%; padding: 12px 16px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--primary-solid); color: #fff; font-weight: 600; font-size: 15px;
    transition: background .15s, opacity .15s;
  }
  .btn:hover { background: var(--primary-solid-hover); }
  .btn:disabled { opacity: .65; cursor: wait; }
  .foot { margin-top: 20px; text-align: center; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <div class="brand-logo"><img src="/logo.png" alt="GRM logo"></div>
    <div>
      <h1>Marketing Tasks</h1>
      <p>ระบบจัดการงานการตลาด — กรุณาเข้าสู่ระบบ</p>
    </div>
  </div>

  <form id="login-form" novalidate>
    <div class="error" id="error" role="alert"></div>
    <div class="field">
      <label for="identifier">อีเมล หรือ ชื่อผู้ใช้</label>
      <input type="text" id="identifier" name="identifier" autocomplete="username" autocapitalize="none" spellcheck="false"
             placeholder="marketing1@domain.com หรือ marketing1" required autofocus>
    </div>
    <div class="field">
      <label for="password">รหัสผ่าน</label>
      <div class="input-wrap">
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="button" class="toggle-pw" id="toggle-pw" aria-label="แสดงรหัสผ่าน" title="แสดง/ซ่อนรหัสผ่าน">
          <svg class="i-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="i-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.8 9.8 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
        </button>
      </div>
    </div>
    <button class="btn" type="submit" id="submit">เข้าสู่ระบบ</button>
  </form>
  <div class="foot">ลืมรหัสผ่าน? ติดต่อผู้ดูแลระบบ</div>
</main>

<script>
  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('error');
  const submit = document.getElementById('submit');
  const pw = document.getElementById('password');
  const toggle = document.getElementById('toggle-pw');

  toggle.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    toggle.classList.toggle('on', show);
    toggle.setAttribute('aria-label', show ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน');
    pw.focus();
  });

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    const identifier = form.identifier.value.trim();
    const password = pw.value;
    if (!identifier || !password) return showError('กรุณากรอกอีเมล/ชื่อผู้ใช้ และรหัสผ่าน');

    submit.disabled = true;
    submit.textContent = 'กำลังเข้าสู่ระบบ...';
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identifier, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'เข้าสู่ระบบไม่สำเร็จ');
      location.replace('/');
    } catch (err) {
      showError(err.message === 'Failed to fetch' ? 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้' : err.message);
      pw.select();
      submit.disabled = false;
      submit.textContent = 'เข้าสู่ระบบ';
    }
  });
</script>
</body>
</html>
